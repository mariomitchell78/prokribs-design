<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Move-in checklist</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="frame.css">
<script src="runtime.js"></script>
<script src="frame.js" defer></script>
</head>
<body>
<div class="pk-bar"><a href="index.html">All screens</a><span>16b Move-in checklist</span></div>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#E8B24A;text-decoration:none}a:hover{color:#F3C873}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E1116; color: #F4F2EE; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; padding: 56px 20px 30px; gap: 14px">
<div style="display: flex; align-items: center; gap: 12px">
<a href="Trip.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 12px; background: #171B22; display: flex; align-items: center; justify-content: center; color: #F4F2EE"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
<h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 28px; text-transform: uppercase">Move-in checklist</h1>
</div>
<p style="margin: 0; font-size: 14px; line-height: 1.5; color: #A3A9B4">Snap each room within 24 hours of arriving. Photos are time stamped and protect your $500 deposit.</p>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; font-size: 13px"><span>{{done}} of {{total}} rooms</span><span style="color: #A3A9B4">Due Feb 2, 3:00 PM</span></div>
<div style="height: 8px; border-radius: 4px; background: #2A303B; overflow: hidden"><div style="width: {{pct}}; height: 8px; background: #E8B24A"></div></div>
</div>
<div style="display: flex; flex-direction: column; border-radius: 16px; background: #171B22; padding: 0 14px">
<sc-for list="{{rooms}}" as="r" hint-placeholder-count="6">
<div style="display: flex; align-items: center; gap: 12px; min-height: 58px; border-bottom: {{r.border}}">
<div style="width: 40px; height: 40px; border-radius: 10px; background: {{r.thumb}}; display: flex; align-items: center; justify-content: center; color: #5FD3A0; flex-shrink: 0"><sc-if value="{{r.ok}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></sc-if></div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 600">{{r.name}}</span><span style="font-size: 12px; color: #A3A9B4">{{r.sub}}</span></div>
<button type="button" onClick="{{r.snap}}" style="height: 40px; padding: 0 14px; border-radius: 10px; border: 0; background: {{r.btnBg}}; color: {{r.btnFg}}; font: 600 13px Inter, sans-serif">{{r.btn}}</button>
</div>
</sc-for>
</div>
<a href="Support.html" style="font-size: 13px; font-weight: 600">Something broken or missing? Report it</a>
<sc-if value="{{complete}}" hint-placeholder-val="{{ false }}">
<a href="Trip.html" style="margin-top: auto; display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 14px; background: #E8B24A; color: #0E1116; font-weight: 700; font-size: 16px">Submit checklist</a>
</sc-if>
<sc-if value="{{incomplete}}" hint-placeholder-val="{{ true }}">
<button type="button" disabled style="margin-top: auto; height: 54px; border-radius: 14px; border: 0; background: #2A303B; color: #A3A9B4; font: 700 16px Inter, sans-serif">Photograph every room to submit</button>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { done: [true, true, false, false, false, false] }; }
  renderVals() {
    const names = ['Living room', 'Kitchen', 'Primary bedroom', 'Bedroom 2', 'Bathrooms', 'Home gym'];
    const d = this.state.done;
    const rooms = names.map((name, i) => ({
      name, ok: d[i], sub: d[i] ? '4 photos · notes added' : 'Not started',
      thumb: d[i] ? '#16352A' : '#2A303B',
      btn: d[i] ? 'Retake' : 'Add photos', btnBg: d[i] ? '#2A303B' : '#E8B24A', btnFg: d[i] ? '#F4F2EE' : '#0E1116',
      border: i === names.length - 1 ? '0' : '1px solid #232833',
      snap: () => { const n = d.slice(); n[i] = true; this.setState({ done: n }); }
    }));
    const count = d.filter(Boolean).length;
    return { rooms, done: count, total: names.length, pct: Math.round(count / names.length * 100) + '%', complete: count === names.length, incomplete: count !== names.length };
  }
}
</script>
</body>
</html>
