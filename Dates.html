<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Choose your stay</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="frame.css">
<script src="runtime.js"></script>
<script src="frame.js" defer></script>
</head>
<body>
<div class="pk-bar"><a href="index.html">All screens</a><span>10 Choose your stay</span></div>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#E8B24A;text-decoration:none}a:hover{color:#F3C873}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E1116; color: #F4F2EE; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; padding: 56px 20px 30px; gap: 16px">
<div style="display: flex; align-items: center; gap: 12px">
<a href="Listing.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 12px; background: #171B22; display: flex; align-items: center; justify-content: center; color: #F4F2EE"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
<h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 28px; text-transform: uppercase">Choose your stay</h1>
</div>
<div style="display: flex; gap: 8px">
<button type="button" style="height: 38px; padding: 0 14px; border-radius: 999px; border: 0; background: #E8B24A; color: #0E1116; font: 700 13px Inter, sans-serif">Full season</button>
<button type="button" style="height: 38px; padding: 0 14px; border-radius: 999px; border: 0; background: #1E232C; color: #F4F2EE; font: 500 13px Inter, sans-serif">Training camp</button>
<button type="button" style="height: 38px; padding: 0 14px; border-radius: 999px; border: 0; background: #1E232C; color: #F4F2EE; font: 500 13px Inter, sans-serif">Custom</button>
</div>
<div style="border-radius: 18px; background: #171B22; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; justify-content: space-between">
<button type="button" aria-label="Previous month" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; color: #A3A9B4"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
<div style="font-weight: 600">February 2027</div>
<button type="button" aria-label="Next month" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; color: #A3A9B4"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
</div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; text-align: center; font-size: 11px; color: #A3A9B4"><div>S</div><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div></div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px">
<sc-for list="{{days}}" as="d" hint-placeholder-count="29">
<div style="height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; background: {{d.bg}}; color: {{d.fg}}">{{d.label}}</div>
</sc-for>
</div>
<div style="font-size: 12px; color: #A3A9B4">Continues through May 31, 2027</div>
</div>
<div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 14px; background: #16352A; color: #5FD3A0; font-size: 13px; font-weight: 600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>120 nights. Meets the 31 night minimum.</div>
<div style="display: flex; flex-direction: column; border-radius: 14px; background: #171B22; padding: 0 14px">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #232833"><div style="font-size: 14px">Guests</div><div style="display: flex; align-items: center; gap: 14px"><button type="button" aria-label="Fewer guests" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid #2A303B; background: transparent; color: #F4F2EE; font-size: 18px">-</button><span style="font-weight: 600">2</span><button type="button" aria-label="More guests" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid #2A303B; background: transparent; color: #F4F2EE; font-size: 18px">+</button></div></div>
<div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 0"><div style="font-size: 14px">Pets</div><div style="display: flex; align-items: center; gap: 14px"><button type="button" aria-label="Fewer pets" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid #2A303B; background: transparent; color: #F4F2EE; font-size: 18px">-</button><span style="font-weight: 600">1</span><button type="button" aria-label="More pets" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid #2A303B; background: transparent; color: #F4F2EE; font-size: 18px">+</button></div></div>
</div>
<a href="Checkout.html" style="margin-top: auto; display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 14px; background: #E8B24A; color: #0E1116; font-weight: 700; font-size: 16px">Review booking</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const days = [{ label: '', bg: 'transparent', fg: '#F4F2EE' }];
    for (let i = 1; i <= 28; i++) {
      days.push(i === 1
        ? { label: String(i), bg: '#E8B24A', fg: '#0E1116' }
        : { label: String(i), bg: '#3A2E14', fg: '#F4F2EE' });
    }
    return { days };
  }
}
</script>
</body>
</html>
