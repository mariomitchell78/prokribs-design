<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FAQ</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="frame.css">
<script src="runtime.js"></script>
<script src="frame.js" defer></script>
</head>
<body>
<div class="pk-bar"><a href="index.html">All screens</a><span>28 FAQ</span></div>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#E8B24A;text-decoration:none}a:hover{color:#F3C873}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E1116; color: #F4F2EE; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; padding: 56px 20px 24px; gap: 14px">
<div style="display: flex; align-items: center; gap: 12px">
<a href="Profile.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 12px; background: #171B22; display: flex; align-items: center; justify-content: center; color: #F4F2EE"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
<h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 28px; text-transform: uppercase">FAQ</h1>
</div>
<label style="display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 14px; border-radius: 14px; background: #171B22; border: 1px solid #2A303B"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A3A9B4" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg><span style="position: absolute; left: -9999px">Search questions</span><input placeholder="Search questions" style="flex: 1; min-width: 0; border: 0; background: transparent; color: #F4F2EE; font: 400 15px Inter, sans-serif"></label>
<div style="display: flex; gap: 8px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
<button type="button" onClick="{{t.pick}}" style="height: 36px; padding: 0 14px; border-radius: 999px; border: 0; background: {{t.bg}}; color: {{t.fg}}; font: 600 13px Inter, sans-serif">{{t.label}}</button>
</sc-for>
</div>
<div style="flex: 1; overflow: hidden; display: flex; flex-direction: column; border-radius: 16px; background: #171B22; padding: 0 16px">
<sc-for list="{{qs}}" as="q" hint-placeholder-count="6">
<div style="border-bottom: 1px solid #232833">
<button type="button" onClick="{{q.toggle}}" style="width: 100%; min-height: 52px; display: flex; align-items: center; gap: 10px; padding: 0; border: 0; background: transparent; color: #F4F2EE; text-align: left; font: 600 14px Inter, sans-serif"><span style="flex: 1">{{q.q}}</span><span style="color: #E8B24A; font-size: 18px; width: 16px; text-align: center">{{q.sign}}</span></button>
<sc-if value="{{q.open}}" hint-placeholder-val="{{ false }}"><p style="margin: 0 0 14px; font-size: 13px; line-height: 1.55; color: #A3A9B4">{{q.a}}</p></sc-if>
</div>
</sc-for>
</div>
<a href="Contact.html" style="display: flex; align-items: center; justify-content: center; height: 50px; border-radius: 14px; border: 1px solid #2A303B; color: #F4F2EE; font-weight: 600; font-size: 15px">Still need help? Contact us</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { tab: 0, open: 0 }; }
  renderVals() {
    const data = [
      ['Players', [
        ['Who can book on ProKribs?', 'Verified professional athletes and their approved households. Every member passes ID, selfie and playing status checks before booking.'],
        ['Why is the minimum stay 31 nights?', 'ProKribs is built for season length stays. Stays of 31 nights or more are treated as monthly rentals, not short term hotel stays.'],
        ['When is my card charged?', 'Your card is only held when you request. It is charged when the host accepts. After that, rent is charged on the same day each month.'],
        ['What if I am traded or released?', 'Tell us right away from Help. You can end your stay early under the trade or release policy. [Terms pending]'],
        ['How do I get my deposit back?', 'Complete the move-out checklist with photos. Your $500 deposit is returned within [X] days unless the host files an approved damage claim.'],
        ['Who can see my information?', 'Hosts see your first name, last initial and verification badges. Your full name, team and contact info are shared only after a booking is confirmed.']
      ]],
      ['Hosts', [
        ['How do I get paid?', 'Payouts go to your bank through Stripe each month, minus the 10% host fee. Month one is released 24 hours after move-in.'],
        ['What do I need to list?', 'At least 5 photos, proof you own or can sublease the home, house rules, and a connected Stripe account.'],
        ['What if there is damage?', 'File a claim with photos within [X] days of move-out. We compare it to the move-in checklist before using the deposit.'],
        ['Can I choose who stays?', 'Yes. You accept or decline each request. Declines need a reason and must follow our nondiscrimination policy.']
      ]],
      ['Account', [
        ['How do I change my password?', 'Go to Profile, then Security and privacy, then Change password.'],
        ['How do I delete my account?', 'Go to Profile, then Security and privacy, then Delete account. Active bookings must be finished or canceled first.'],
        ['Is my payment info safe?', 'Card details are handled by Stripe and never stored on ProKribs servers.']
      ]]
    ];
    const tab = this.state.tab;
    const tabs = data.map(([label], i) => ({
      label, bg: i === tab ? '#E8B24A' : '#1E232C', fg: i === tab ? '#0E1116' : '#F4F2EE',
      pick: () => this.setState({ tab: i, open: -1 })
    }));
    const qs = data[tab][1].map(([q, a], i) => ({
      q, a, open: this.state.open === i, sign: this.state.open === i ? '-' : '+',
      toggle: () => this.setState({ open: this.state.open === i ? -1 : i })
    }));
    return { tabs, qs };
  }
}
</script>
</body>
</html>
